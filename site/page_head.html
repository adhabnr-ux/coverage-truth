<title>Coverage Truth Arizona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#eef1ee; --paper:#f8faf8; --ink:#17262b; --ink-2:#44555b; --ink-3:#6c7c81; --rule:#cdd6d3;
  --accent:#0f6a86; --accent-soft:#d6e8ee; --land:#dfe5e1; --tribal:#dcc9a6; --tribal-line:#b99a68;
  --ok:#2f7d57; --thin:#b7791f; --none-ev:#b8403a; --noclaim:#7a8a8f; --focus:#0f6a86;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#111a1d; --paper:#172327; --ink:#e4ecea; --ink-2:#b3c2c3; --ink-3:#8a9b9d; --rule:#2b3b40;
    --accent:#5fb6d1; --accent-soft:#1c3a45; --land:#1f2c30; --tribal:#4a3f2b; --tribal-line:#8f7550;
    --ok:#5cbf8a; --thin:#e2a54a; --none-ev:#ef7b72; --noclaim:#8d9ea3; --focus:#5fb6d1;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111a1d; --paper:#172327; --ink:#e4ecea; --ink-2:#b3c2c3; --ink-3:#8a9b9d; --rule:#2b3b40;
  --accent:#5fb6d1; --accent-soft:#1c3a45; --land:#1f2c30; --tribal:#4a3f2b; --tribal-line:#8f7550;
  --ok:#5cbf8a; --thin:#e2a54a; --none-ev:#ef7b72; --noclaim:#8d9ea3; --focus:#5fb6d1;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:28px 56px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6vw,64px);line-height:.95;letter-spacing:.005em;margin:.15em 0 .2em;text-wrap:balance;text-transform:uppercase}
h2{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 .4em;text-wrap:balance}
h3{font-family:var(--body);font-size:17px;margin:0;text-wrap:balance}
.lede{font-size:clamp(17px,2vw,20px);max-width:62ch;color:var(--ink);margin:.4em 0 0}
.lede strong{color:var(--none-ev)}
.byline{color:var(--ink-3);font-size:13px;margin-top:10px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* status legend and compare bars */
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px 32px;margin:28px 0 8px}
.bar-row{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center}
.bar-row .lab{font-size:13px;color:var(--ink-2)}
.bar{display:flex;height:22px;border-radius:3px;overflow:hidden;background:var(--rule)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.s-checked{background:var(--ok)} .s-thin{background:var(--thin)} .s-unverified{background:var(--none-ev)} .s-none{background:var(--noclaim)} .s-below{background:#6b2fa0}

/* main tool */
.tool{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;margin-top:30px;align-items:start}
@media (max-width:860px){.tool{grid-template-columns:1fr}}
.mapbox{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px}
.mapbox svg{width:100%;height:auto;display:block}
.mapnote{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;font-size:12px;color:var(--ink-3);margin-top:6px}
.controls{display:flex;flex-direction:column;gap:12px}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink)}
.results{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--paper);border:1px solid var(--rule);border-radius:5px;max-height:320px;overflow:auto;margin:0;padding:4px 0;list-style:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.results li button{all:unset;display:flex;gap:8px;align-items:center;width:100%;box-sizing:border-box;padding:7px 12px;cursor:pointer;font-size:14px}
.results li button:hover,.results li button:focus-visible{background:var(--accent-soft)}
.results small{color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.chip[aria-pressed="false"]{opacity:.55}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 18px 16px}
.card .where{color:var(--ink-3);font-size:13px;margin-top:2px}
.verdict{display:flex;gap:10px;align-items:flex-start;margin:14px 0 12px;padding:10px 12px;border-radius:5px;background:var(--ground)}
.verdict .dot{margin-top:5px}
.verdict b{display:block;font-size:15px}
.verdict span{font-size:13.5px;color:var(--ink-2)}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.facts dt{color:var(--ink-3)}
dl.facts dd{margin:0}
.phys{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
.phys h4{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;font-weight:500}
.phys table{width:100%;border-collapse:collapse;font-size:13px}
.phys td,.phys th{text-align:left;padding:4px 6px 4px 0;border-bottom:1px solid var(--rule)}
.phys th{font-weight:500;color:var(--ink-3)}
.phys .flag{color:var(--none-ev);font-weight:600}
.phys p{font-size:13px;color:var(--ink-2);margin:8px 0 0}

section.block{margin-top:46px}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table.list{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.list th,table.list td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--rule)}
table.list th{font-weight:600;font-size:12.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;background:var(--ground)}
table.list tr:last-child td{border-bottom:none}
table.list button{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
table.list td.r,table.list th.r{text-align:right}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 28px;font-size:14px;color:var(--ink-2)}
.method p{margin:.3em 0 0;max-width:62ch}
footer{margin-top:46px;padding-top:16px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3)}
svg .school{cursor:pointer;stroke:var(--paper);stroke-width:.6}
svg .school.dim{opacity:.12}
svg .sel{fill:none;stroke:var(--ink);stroke-width:2}
@media (prefers-reduced-motion:no-preference){svg .sel{transition:transform .2s}}
</style>
